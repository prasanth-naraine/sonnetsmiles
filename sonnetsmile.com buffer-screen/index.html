<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonnet Smiles</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap');

        /* universal */
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-size: 16px;
            font-family: "DM Sans", sans-serif;
            font-weight: 300;
            letter-spacing: -3% !important;
            text-align: center;
        }

        @media screen and (max-width: 800px) {
            * {
                letter-spacing: -5% !important;
            }
        }

        body,
        html {
            /* height: 500vh; */
            scroll-behavior: smooth !important;
            max-width: 100%;
            overflow: hidden;
        }

        body {
            padding: 2rem 5%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            height: 100vh;
            background: whitesmoke;
        }

        body::-webkit-scrollbar {
            display: none;
        }

        .image {
            width: 100%;
            position: fixed;
            top: 0rem;
            height: max-content;
            left: 0;
            /* border: 1px solid red; */
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            padding: 1rem;
            border-bottom: 1px solid gainsboro;
        }


        .image img{
            height: 3rem;
            max-width: 100%;
        }

        h2 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 400;
            line-height: 1.05;
        }

        p{
            font-size: clamp(1.25rem, 2vw, 2rem);
            margin-top: 1rem;
            opacity: .5;
            max-width: 50%;
        }

        @media screen and (max-width: 800px) {
            p{
                max-width: 90%;
                margin-top: .5rem;
            }
        }
    </style>

</head>

<body>

    <div class="image">
        <img src="./logo.jpg" alt="logo">
    </div>

    <h2>
        A Beautiful Smile Is Just Around the Corner.
    </h2>
    <p>
        Something wonderful is taking shape. We're getting ready to welcome you to a dental experience where advanced
        care meets comfort, confidence, and beautiful smiles.
    </p>

</body>

</html>
